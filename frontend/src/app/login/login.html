
<div class="login-page">

  <div class="login-card">

    <div class="brand">
      <h1>OpsTrack</h1>

      <p>
        Aircraft Maintenance & Operations
        Management System
      </p>
    </div>

    <div class="login-heading">
      <p class="section-label">
        SECURE ACCESS
      </p>

      <h2>Sign In</h2>

      <p>
        Enter your OpsTrack account credentials
        to continue.
      </p>
    </div>

    <form
      class="login-form"
      (ngSubmit)="login()"
    >

      <label>
        <span>Username</span>

        <input
          type="text"
          name="username"
          [(ngModel)]="username"
          autocomplete="username"
          placeholder="Enter username"
        >
      </label>


      <label>
        <span>Password</span>

        <input
          type="password"
          name="password"
          [(ngModel)]="password"
          autocomplete="current-password"
          placeholder="Enter password"
        >
      </label>


      @if (errorMessage) {

        <div class="error-message">
          {{ errorMessage }}
        </div>

      }


      <button
        class="login-button"
        type="submit"
        [disabled]="loading"
      >
        @if (loading) {
          Signing In...
        } @else {
          Sign In
        }
      </button>

    </form>

    <p class="login-footer">
      Authorized OpsTrack users only
    </p>

  </div>

</div>
